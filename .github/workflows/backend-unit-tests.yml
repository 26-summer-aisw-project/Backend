name: Backend Unit Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: gradlew test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify tested commit
        shell: bash
        run: |
          EXPECTED_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "TESTED_SHA=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

      - name: Diagnose API contract matrix failure
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET

          report = "build/test-results/test/TEST-kr.lostory.backend.ApiContractIntegrationTest.xml"
          allowed_rows = frozenset({
              "POST /api/v1/auth/signup",
              "POST /api/v1/auth/login",
              "POST /api/v1/partner-manager-activations/{activationToken}",
          })
          row_pattern = "|".join(re.escape(row) for row in sorted(allowed_rows))
          pattern = re.compile(
              rf"matrix row (?P<row>{row_pattern}) "
              r"expected HTTP (?P<expected>[0-9]{3}) actual HTTP (?P<actual>[0-9]{3})"
          )

          try:
              failures = ET.parse(report).getroot().iter("failure")
              for failure in failures:
                  match = pattern.fullmatch(failure.attrib.get("message", ""))
                  if match:
                      print(f"matrix row {match.group('row')} expected HTTP "
                            f"{match.group('expected')} actual HTTP {match.group('actual')}")
                      break
          except Exception:
              pass
          finally:
              sys.exit(0)
          PY
