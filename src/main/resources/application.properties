spring.application.name=backend
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.jpa.hibernate.ddl-auto=none
management.endpoints.web.exposure.include=health
server.port=${SERVER_PORT:8080}
app.jwt.issuer=${JWT_ISSUER}
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
found-item.draft-ttl=${FOUND_ITEM_DRAFT_TTL:PT24H}
found-item.terminal-media-retention=${FOUND_ITEM_TERMINAL_MEDIA_RETENTION:P30D}
found-item.ttl=${FOUND_ITEM_TTL:P14D}
object-storage.enabled=${OBJECT_STORAGE_ENABLED:false}
object-storage.endpoint=${OBJECT_STORAGE_ENDPOINT:https://storage.googleapis.com}
object-storage.region=${OBJECT_STORAGE_REGION:auto}
object-storage.bucket=${OBJECT_STORAGE_BUCKET:disabled}
object-storage.path-style=${OBJECT_STORAGE_PATH_STYLE:false}
object-storage.timeout=${OBJECT_STORAGE_TIMEOUT:PT10S}
object-storage.read-url-ttl=${OBJECT_STORAGE_READ_URL_TTL:PT5M}
object-storage.orphan-grace=${OBJECT_STORAGE_ORPHAN_GRACE:PT1H}
object-storage.orphan-sweep-interval=${OBJECT_STORAGE_ORPHAN_SWEEP_INTERVAL:PT10M}
object-storage.orphan-sweep-initial-delay=${OBJECT_STORAGE_ORPHAN_SWEEP_INITIAL_DELAY:PT10M}
vision.enabled=${VISION_ENABLED:false}
vision.provider=${VISION_PROVIDER:google-cloud-vision}
vision.processing-region=${VISION_PROCESSING_REGION:global}
vision.data-retention=${VISION_DATA_RETENTION:PT0S}
vision.cost-limit-usd=${VISION_COST_LIMIT_USD:10.00}
vision.daily-job-limit=${VISION_DAILY_JOB_LIMIT:100}
vision.timeout=${VISION_TIMEOUT:PT10S}
matching.radius-min=${MATCHING_RADIUS_MIN:500}
matching.radius-base=${MATCHING_RADIUS_BASE:1000}
matching.radius-max=${MATCHING_RADIUS_MAX:3000}
matching.radius-coefficient=${MATCHING_RADIUS_COEFFICIENT:0.10}
matching.radius-policy-version=${MATCHING_RADIUS_POLICY_VERSION:p0-radius-v1}
matching.time-window=${MATCHING_TIME_WINDOW:PT24H}
lost-report.ttl=${LOST_REPORT_TTL:P14D}
center.nearby-radius=${CENTER_NEARBY_RADIUS:1000}
center.nearby-limit=${CENTER_NEARBY_LIMIT:10}
partner.activation-base-url=${PARTNER_ACTIVATION_BASE_URL:https://app.example/partner-activation}
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:6MB}
