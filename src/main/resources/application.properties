spring.application.name=backend
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.jpa.hibernate.ddl-auto=none
management.endpoints.web.exposure.include=health
server.port=${SERVER_PORT:8080}
app.jwt.issuer=${JWT_ISSUER}
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
lost-center.nearby-limit=${LOST_CENTER_NEARBY_LIMIT:3}
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:25MB}
