spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lostory}
spring.datasource.username=${DB_USERNAME:lostory}
spring.datasource.password=${DB_PASSWORD:lostory}
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
object-storage.enabled=${OBJECT_STORAGE_ENABLED:true}
object-storage.endpoint=${OBJECT_STORAGE_ENDPOINT}
object-storage.region=${OBJECT_STORAGE_REGION:us-east-1}
object-storage.bucket=${OBJECT_STORAGE_BUCKET}
object-storage.path-style=${OBJECT_STORAGE_PATH_STYLE:true}
