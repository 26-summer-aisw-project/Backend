<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --parchment: #f7f7f4;
      --bone: #f2f1ed;
      --linen: #e6e5e0;
      --stone: #cdcdc9;
      --mist: #a1a19f;
      --driftwood: #84847e;
      --ash: #7a7974;
      --ink: #26251e;
      --ember: #f54e00;
      --amber: #c08532;
      --crimson: #cf2d56;
      --sans: "Inter", "Noto Sans KR", sans-serif;
      --serif: "EB Garamond", "Noto Serif KR", serif;
      --mono: "IBM Plex Mono", "Noto Sans Mono CJK KR", monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--parchment);
      color: var(--ink);
      font-family: var(--sans);
      font-feature-settings: "ss08" 1, "ss09" 1, "tnum" 1;
    }

    main {
      width: min(100%, 1280px);
      margin: 0 auto;
      padding: 48px 32px 96px;
    }

    h1, h2 { margin: 0; font-weight: 400; }

    h1 {
      font-family: var(--sans);
      font-size: 40px;
      letter-spacing: -0.022em;
      line-height: 1;
    }

    figure { margin: 0 0 96px; }
    h1 + figure { margin-top: 32px; }

    figcaption {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin: 0 0 24px;
    }

    h2 {
      font-family: var(--sans);
      font-size: 24px;
      letter-spacing: -0.012em;
      line-height: 1.33;
    }

    .caption-note { color: var(--ash); font: 400 12px/1.4 var(--mono); }
    svg { display: block; width: 100%; height: auto; }

    .connector {
      fill: none;
      stroke: var(--ash);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.2;
    }

    .node .mask { fill: var(--parchment); }
    .node .box { fill: var(--bone); stroke: var(--stone); stroke-width: 1; }
    .node.focus .box { fill: var(--linen); stroke: var(--driftwood); stroke-width: 1.2; }
    .node .tag-box { fill: var(--crimson); stroke: var(--crimson); stroke-width: 0.8; }
    .node.focus .tag-box { stroke: var(--crimson); }
    .node .header-box { fill: var(--ink); }
    .node .separator { stroke: var(--stone); stroke-width: 0.8; }
    .node .tag, .field, .cardinality, .legend-text { font-family: var(--mono); }
    .node .tag { fill: var(--parchment); font-size: 8px; font-weight: 500; letter-spacing: 0.08em; }
    .node .entity { fill: var(--parchment); font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: -0.01em; }
    .field { fill: var(--ink); font-size: 8px; }
    .field.pk, .legend-text.pk { fill: var(--ember); }
    .field.fk, .legend-text.fk { fill: var(--amber); }
    .field .key { fill: var(--ember); font-weight: 500; }
    .field .fk { fill: var(--amber); font-weight: 500; }
    .field .optional { fill: var(--ash); }
    .cardinality { fill: var(--driftwood); font-size: 8px; }
    .legend-rule { stroke: var(--stone); stroke-width: 0.8; }
    .legend-title { fill: var(--ash); font: 500 8px/1 var(--mono); letter-spacing: 0.14em; }
    .legend-text { fill: var(--ash); font-size: 8px; }

    @media (max-width: 767px) {
      main { padding: 32px 16px 64px; }
      h1 { font-size: 32px; }
      figcaption { align-items: flex-start; flex-direction: column; gap: 8px; }
    }
  </style>
</head>
